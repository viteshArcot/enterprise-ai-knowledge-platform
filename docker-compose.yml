# =============================================================================
# Enterprise AI Knowledge Platform — Docker Compose
# =============================================================================
# Services (Phase 1):
#   backend    — FastAPI application (port 8000)
#   frontend   — React SPA via nginx (port 3000)
#   db         — PostgreSQL 16 (port 5432)
#
# Usage:
#   docker compose up --build          # First run or after Dockerfile changes
#   docker compose up                  # Start with cached images
#   docker compose up backend          # Start a single service
#   docker compose down -v             # Stop and remove volumes
#
# Environment:
#   Copy .env.example to .env and fill in the required values before starting.
# =============================================================================

services:

  # ===========================================================================
  # Backend — FastAPI application
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime        # Use production runtime stage by default
    container_name: aikp_backend
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    environment:
      SECRET_KEY:            "${SECRET_KEY}"
      DATABASE_URL:          "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-knowledge_platform}"
      ENVIRONMENT:           "${ENVIRONMENT:-development}"
      LOG_LEVEL:             "${LOG_LEVEL:-INFO}"
      LOG_FORMAT:            "${LOG_FORMAT:-console}"
      DEBUG:                 "${DEBUG:-false}"
      CORS_ORIGINS:          "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      GEMINI_API_KEY:        "${GEMINI_API_KEY:-}"
      GEMINI_CHAT_MODEL:     "${GEMINI_CHAT_MODEL:-gemini-2.0-flash}"
      GEMINI_EMBEDDING_MODEL: "${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}"
      LLM_PROVIDER:          "${LLM_PROVIDER:-gemini}"
      OPENROUTER_API_KEY:    "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL:      "${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}"
      OPENROUTER_BASE_URL:   "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      OLLAMA_BASE_URL:       "${OLLAMA_BASE_URL:-http://localhost:11434}"

    volumes:
      - ./backend/uploads:/app/uploads

    # Development override: mount source code for hot reload
    # volumes:
    #   - ./backend/app:/app/app:ro
    # command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

    networks:
      - aikp_network

  # ===========================================================================
  # Frontend — React SPA (nginx)
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: aikp_frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      - backend

    networks:
      - aikp_network

  # ===========================================================================
  # Database — PostgreSQL 16 + pgvector
  # ===========================================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: aikp_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER:     "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB:       "${POSTGRES_DB:-knowledge_platform}"
      PGDATA:            /var/lib/postgresql/data/pgdata

    ports:
      # Expose for direct DB access (e.g., database GUI, Alembic migrations)
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_platform}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

    networks:
      - aikp_network


# =============================================================================
# Volumes — Named volumes survive container restarts
# =============================================================================
volumes:
  postgres_data:
    driver: local
    name: aikp_postgres_data


# =============================================================================
# Networks — Isolated network for all services
# =============================================================================
networks:
  aikp_network:
    driver: bridge
    name: aikp_network
