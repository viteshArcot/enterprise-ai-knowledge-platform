# =============================================================================
# Enterprise AI Knowledge Platform — Backend
# =============================================================================
# Single source of truth for packaging, dependencies, and tooling config.
# PEP 517/518/621 compliant. No setup.py, no setup.cfg, no scattered configs.
# =============================================================================

[project]
name = "enterprise-ai-knowledge-platform"
version = "0.1.0"
description = "Production-grade Enterprise AI Knowledge Platform Backend API"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Configuration & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Database (async)
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",

    # Structured logging
    "structlog>=24.4.0",

    # HTTP client (used in health checks & future LLM calls)
    "httpx>=0.28.0",

    # Form data / file uploads
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",

    # Linting & formatting
    "ruff>=0.8.0",
    "black>=24.10.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]   # searches in backend/ directory
include = ["app*"]


# =============================================================================
# Ruff — Fast Python linter (replaces flake8, isort, pyupgrade, and more)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "N",    # pep8-naming conventions
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs & design issues)
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations (type annotation enforcement)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN401",   # Dynamically typed expressions (Any) — needed for generics
    "B008",     # Do not perform function calls in argument defaults (FastAPI Depends)
    "N818",     # AppException naming — intentional (base class, not leaf exception)
    "UP046",    # Generic[T] pattern — needed for ABC + Generic pattern in 3.12
    "RUF012",   # ClassVar mutable default — SQLAlchemy pattern, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"              = ["ANN", "S101"]
"app/core/dependencies.py"   = ["ANN"]
"app/config/settings.py"     = ["N805"]

[tool.ruff.lint.isort]
known-first-party = ["app"]


# =============================================================================
# Black — Opinionated code formatter
# =============================================================================
[tool.black]
target-version = ["py312"]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | __pycache__
  | dist
  | build
  | alembic
)/
'''


# =============================================================================
# Pytest — Test configuration
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode  = "auto"
testpaths     = ["tests"]
addopts       = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests as integration tests (require live services)",
    "unit: marks tests as pure unit tests",
]

[tool.coverage.run]
source  = ["app"]
omit    = ["tests/*", "alembic/*"]
branch  = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
