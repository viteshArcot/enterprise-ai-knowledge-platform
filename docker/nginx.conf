# =============================================================================
# nginx configuration — Single Page Application (SPA) server
# =============================================================================
# This config serves the React SPA correctly:
#   - Static files served with caching headers
#   - All unknown routes fall back to index.html (client-side routing)
#   - Gzip compression enabled
#   - Security headers set
# =============================================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"    always;
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Static asset caching ─────────────────────────────────────────────────
    # Vite fingerprints assets (hashed filenames) — cache them aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # React Router handles client-side navigation. nginx must return index.html
    # for all paths that don't match a real file (404 would break deep links).
    location / {
        try_files $uri $uri/ /index.html;

        # HTML is NOT cached — always fetch fresh
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
